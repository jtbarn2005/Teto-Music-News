name: Update Teto video feed

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. These two runs cover both MST and MDT;
    # update_feed.py keeps only the run that is midnight in America/Denver.
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update JSON feed
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/update_feed.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git diff --cached --quiet || git commit -m "Update Teto video feed"
          git push
