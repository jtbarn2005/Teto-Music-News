plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def feedUrl = localProperties.getProperty('TETO_FEED_URL', 'https://raw.githubusercontent.com/YOUR_GITHUB_USERNAME/YOUR_REPOSITORY/main/data/videos.json')

// Allow local build output outside folders that restrict deletion of generated files.
def localBuildDir = localProperties.getProperty('TETO_BUILD_DIR')
if (localBuildDir) {
    layout.buildDirectory.set(file(localBuildDir))
}

android {
    namespace 'com.example.tetomusicnews'
    compileSdk 37

    defaultConfig {
        applicationId 'com.example.tetomusicnews'
        minSdk 24
        // Android 16/17 target behavior changes reviewed for this feed-only app.
        //noinspection EditedTargetSdkVersion
        targetSdk 37
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'FEED_URL', '"' + feedUrl + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
}
